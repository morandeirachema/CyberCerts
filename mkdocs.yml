# MkDocs Material configuration to render this repo as a browsable site.
#
# This repo keeps its Markdown at the root (foundations/, certs/, protocols/, ...) rather
# than under a single docs/ folder, and MkDocs 1.6 requires docs_dir to be a CHILD of the
# config file. So scripts/build-site.sh copies the content into ./site-src (the docs_dir).
#
# Local preview:  pip install mkdocs-material && bash scripts/build-site.sh && mkdocs serve
site_name: "CyberCerts — sysadmin → PAM architect study hub"
site_description: "Vendor-neutral, source-grounded study hub: PAM foundations, protocols, and full hubs for CEH, CompTIA, OSCP, PNPT and architect-level certifications."
repo_url: https://github.com/morandeirachema/CyberCerts
repo_name: morandeirachema/CyberCerts

docs_dir: site-src
site_dir: site

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

