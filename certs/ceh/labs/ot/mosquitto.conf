# CEH OT range — deliberately INSECURE MQTT broker (anonymous, cleartext).
# This exists to demonstrate MQTT's missing-identity failure: any client can
# subscribe to '#' (read everything) and publish to any topic (inject anything).
#
#   ⛔ LAB ONLY. Never run allow_anonymous on a broker reachable off loopback.

listener 1883
allow_anonymous true
persistence false

