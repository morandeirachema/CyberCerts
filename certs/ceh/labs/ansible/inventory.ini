# Windows AD/PAM lab inventory.
# You provide the Windows Server + client VMs (evaluation ISOs are free — see README).
# Ansible reaches Windows over WinRM; configure WinRM on each VM first (README step 2).

[dc]
dc01 ansible_host=192.168.56.30       # DC + ADCS CA + tiered OUs (the target)

[members]
ws01 ansible_host=192.168.56.31       # domain-joined member = your lateral-movement target
# Optional 3rd host for a fuller chain (leave commented if you only have 2 VMs):
# sql01 ansible_host=192.168.56.32     # hosts the MSSQLSvc SPN used by svc-sql

[windows:children]
dc
members

[windows:vars]
ansible_user=Administrator
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_port=5985
# Store the real password in an Ansible Vault file, never in plaintext here:
#   ansible-vault create group_vars/windows/vault.yml
#   -> set: vault_admin_password: "<your lab admin password>"
ansible_password="{{ vault_admin_password }}"
